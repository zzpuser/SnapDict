name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF_NAME#v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme SnapDict -project SnapDict.xcodeproj

      - name: Build
        run: |
          xcodebuild build \
            -scheme SnapDict \
            -project SnapDict.xcodeproj \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO

      # ad-hoc 签名：不能关掉 CODE_SIGNING_ALLOWED，否则只剩链接器签名（无资源封装），
      # 下载后带 quarantine 会被 Gatekeeper 判定为"已损坏"
      # CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO 避免发布包带上调试用的 get-task-allow
      - name: Verify code signature
        run: |
          APP_PATH="build/Build/Products/Release/SnapDict.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dvvv "$APP_PATH"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          APP_PATH="build/Build/Products/Release/SnapDict.app"
          DMG_NAME="SnapDict-${{ steps.version.outputs.version }}.dmg"

          mkdir -p dmg_content
          cp -R "$APP_PATH" dmg_content/

          create-dmg \
            --volname "SnapDict" \
            --volicon "SnapDict/AppIcon.icns" \
            --background "scripts/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 80 \
            --icon "SnapDict.app" 180 170 \
            --hide-extension "SnapDict.app" \
            --app-drop-link 480 170 \
            --no-internet-enable \
            "$DMG_NAME" \
            dmg_content/ \
          || test $? -eq 2

          echo "dmg_name=$DMG_NAME" >> $GITHUB_ENV

      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Extract release notes from README
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # 从 README.md 提取对应版本的更新内容：### vX.Y.Z 之后，到下一个 #/##/### 标题之前
          # 只用 POSIX awk，不依赖 GNU head（macOS runner 的 BSD head 不支持负数行数）
          NOTES=$(awk -v tag="### ${TAG}" '
            $0 == tag { f = 1; next }
            f && /^(#|##|###) / { exit }
            f && (started || NF) { started = 1; print }
          ' README.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::README.md 中未找到 ### ${TAG} 的更新日志"
          fi
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SnapDict ${{ steps.version.outputs.version }}
          body: |
            ## 更新内容
            ${{ steps.notes.outputs.body }}

            ## 安装方式
            1. 下载 DMG 文件
            2. 打开 DMG，将 SnapDict 拖入 Applications 文件夹
            3. 首次打开时 macOS 会提示无法验证开发者（应用未经 Apple 公证），任选一种方式放行：
               - 打开「系统设置 → 隐私与安全性」，在底部点击「仍要打开」
               - 或在终端执行 `sudo xattr -r -d com.apple.quarantine /Applications/SnapDict.app`
            4. 打开 SnapDict
          files: ${{ env.dmg_name }}
          draft: false
          prerelease: false
